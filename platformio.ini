; PlatformIO Project Configuration
; RP2040 Pico | FreeRTOS (earlephilhower SMP) | TinyUSB

[platformio]
default_envs = pico

[env:pico]
platform     = https://github.com/maxgerhardt/platform-raspberrypi.git
board        = pico
framework    = arduino

; earlephilhower Arduino core – includes FreeRTOS SMP port & TinyUSB
board_build.core            = earlephilhower
board_build.filesystem_size = 0.5m
board_build.f_cpu           = 48000000L

; Use TinyUSB as USB stack (instead of Pico-SDK default tinyusb wrapper)
; Adafruit TinyUSB Library provides tusb_config.h + C++ device classes
lib_deps =
    adafruit/Adafruit TinyUSB Library @ ^3.4.0
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^4.0.4

build_flags =
    ; Enable FreeRTOS in the earlephilhower RP2040 core
    -D __FREERTOS=1
    ; Switch USB stack to TinyUSB (required for Adafruit TinyUSB Library)
    -D USE_TINYUSB
    ; Use real external stepper backend in eaf.cpp
    -D EAF_USE_EXTERNAL_STEPPER

; UF2: put Pico in BOOTSEL mode, then set the drive letter of RPI-RP2 (e.g. E:, F:, ...)
upload_port     = E:
; Alternative: picotool (no BOOTSEL required, must be installed)
; upload_protocol = picotool
; upload_port     =

monitor_speed   = 115200
monitor_filters = send_on_enter, colorize

[env:pico_debug]
extends          = env:pico
build_type       = debug
debug_tool       = cmsis-dap
upload_protocol  = cmsis-dap
